<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk to Peakflow AI — Start Your 7-Day Free Trial</title>
<meta name="description" content="Chat with the Peakflow AI Receptionist to build your 7-day free trial framework.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================= TOKENS (matches index.html) ============================= */
:root{
  --bg: #08090c;
  --surface: #0f1116;
  --surface-2: #14161d;
  --line: rgba(255,255,255,0.08);
  --text: #eef0f3;
  --muted: #868c98;
  --muted-2: #5a5f6a;
  --flow: #5b6eff;
  --flow-soft: rgba(91,110,255,0.14);
  --ember: #ff7a45;
  --lime: #c6ff3d;
  --online: #34e29a;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overflow-x:hidden;
  line-height:1.5;
}
::selection{background:var(--flow); color:#fff;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
:focus-visible{outline:2px solid var(--flow); outline-offset:3px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

/* ============================= BOOT PRELOADER ============================= */
#chatPreloader{
  position:fixed; inset:0; z-index:9999;
  background:#08090c;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-mono);
  transition:opacity 0.7s ease, visibility 0.7s ease;
}
#chatPreloader.hide{opacity:0; visibility:hidden; pointer-events:none;}
.boot-grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(91,110,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,110,255,0.06) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at center, black 0%, transparent 75%);
  animation:gridPulse 3s ease-in-out infinite;
}
@keyframes gridPulse{ 0%,100%{opacity:0.5;} 50%{opacity:1;} }
.boot-ring{
  width:56px; height:56px; border-radius:50%;
  border:2px solid rgba(91,110,255,0.15);
  border-top-color:var(--flow);
  animation:bootSpin 0.9s linear infinite;
  margin-bottom:26px;
  position:relative; z-index:2;
}
@keyframes bootSpin{ to{ transform:rotate(360deg); } }
.boot-status{
  font-size:12px; color:var(--flow); letter-spacing:0.1em; position:relative; z-index:2;
  min-width:260px; text-align:center;
}
.boot-status .cursor-blink{animation:blink 0.9s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.boot-sub{
  font-size:10.5px; color:var(--muted-2); margin-top:10px; letter-spacing:0.08em; position:relative; z-index:2;
}

/* ============================= CHAT ENTRANCE ============================= */
.chat-shell{ opacity:0; transform:scale(0.94) translateY(14px); filter:blur(6px); }
.chat-shell.enter{
  animation:chatEnter 0.9s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes chatEnter{
  to{ opacity:1; transform:scale(1) translateY(0); filter:blur(0); }
}

/* ============================= CURSOR GLOW ============================= */
#cursorGlow{
  position:fixed; top:0; left:0; z-index:2;
  width:420px; height:420px; border-radius:50%;
  background:radial-gradient(circle, rgba(91,110,255,0.10), transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none; opacity:0;
  transition:opacity 0.4s ease;
}
@media (max-width:860px){ #cursorGlow{display:none;} }

/* ============================= FLOATING PARTICLES ============================= */
.particle{
  position:fixed; bottom:-10px; z-index:0; pointer-events:none;
  width:3px; height:3px; border-radius:50%;
  background:var(--flow);
  opacity:0.5;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{ transform:translateY(0) translateX(0); opacity:0; }
  10%{ opacity:0.6; }
  90%{ opacity:0.3; }
  100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
}

/* ============================= AMBIENT BACKGROUND ============================= */
.ambient{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 45% at 22% 15%, rgba(91,110,255,0.14), transparent 60%),
    radial-gradient(ellipse 55% 40% at 82% 85%, rgba(198,255,61,0.06), transparent 60%),
    var(--bg);
}
.ambient::before{
  content:'';
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%, black 0%, transparent 70%);
}
.ambient-glow{
  position:absolute; width:480px; height:480px; border-radius:50%;
  background:radial-gradient(circle, rgba(91,110,255,0.18), transparent 70%);
  filter:blur(10px);
  animation:driftGlow 14s ease-in-out infinite;
  top:-120px; left:-120px;
}
@keyframes driftGlow{
  0%,100%{transform:translate(0,0);}
  50%{transform:translate(120px, 90px);}
}

/* ============================= HEADER ============================= */
header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:20px 0;
  background:rgba(8,9,12,0.55);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1180px; margin:0 auto; padding:0 32px;}
nav{display:flex; align-items:center; justify-content:space-between;}
.logo{
  font-family:var(--font-display); font-weight:600; font-size:19px;
  letter-spacing:-0.01em; display:flex; align-items:center; gap:10px;
}
.logo-mark svg{width:20px; height:20px; display:block;}
.header-status{
  display:flex; align-items:center; gap:10px;
  font-family:var(--font-mono); font-size:12.5px; color:var(--muted);
  letter-spacing:0.03em;
}
.header-status .agent-name{color:var(--text); font-weight:500;}
.pulse-dot{
  position:relative; width:8px; height:8px; border-radius:50%;
  background:var(--online); flex-shrink:0;
}
.pulse-dot::after{
  content:''; position:absolute; inset:-6px; border-radius:50%;
  border:1px solid var(--online);
  animation:pulseRing 1.8s ease-out infinite;
}
@keyframes pulseRing{
  0%{transform:scale(0.5); opacity:0.9;}
  100%{transform:scale(1.8); opacity:0;}
}
.back-link{
  font-family:var(--font-mono); font-size:12px; color:var(--muted);
  display:flex; align-items:center; gap:6px; transition:color 0.25s ease;
}
.back-link:hover{color:var(--text);}
.back-link svg{width:13px; height:13px;}

/* ============================= MAIN LAYOUT ============================= */
main{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:120px 24px 40px;
}

.chat-shell{
  width:100%; max-width:760px;
  display:flex; flex-direction:column; align-items:center;
}
.chat-eyebrow{
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--flow); display:flex; align-items:center; gap:8px; margin-bottom:14px;
}
.chat-eyebrow::before{
  content:''; width:6px; height:6px; background:var(--flow); border-radius:50%;
  box-shadow:0 0 8px 2px var(--flow-soft);
}
.chat-title{
  font-family:var(--font-display); font-weight:600; letter-spacing:-0.02em;
  font-size:clamp(26px, 4vw, 38px); text-align:center; margin-bottom:34px;
}
.chat-title .accent{
  background:linear-gradient(100deg, var(--flow) 10%, #9fb0ff 50%, var(--flow) 90%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

/* ============================= GLASS CHAT WINDOW ============================= */
.chat-window{
  width:100%;
  border-radius:20px;
  background:linear-gradient(180deg, rgba(20,22,29,0.7), rgba(10,11,15,0.75));
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 0 0 1px rgba(91,110,255,0.06),
    0 30px 80px -20px rgba(0,0,0,0.7),
    0 0 60px -10px rgba(91,110,255,0.15);
  overflow:hidden;
  display:flex; flex-direction:column;
  position:relative;
}
.chat-window::before{
  content:'';
  position:absolute; inset:0; border-radius:20px; padding:1px;
  background:linear-gradient(135deg, rgba(91,110,255,0.4), transparent 30%, transparent 70%, rgba(198,255,61,0.15));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.chat-window::after{
  content:'';
  position:absolute; inset:-1px; border-radius:20px; padding:1.5px;
  background:conic-gradient(from var(--angle,0deg), transparent 0%, rgba(91,110,255,0.7) 8%, transparent 22%, transparent 70%, rgba(198,255,61,0.4) 82%, transparent 92%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:0.7;
  animation:rotateBorder 6s linear infinite;
}
@property --angle{
  syntax:'<angle>'; initial-value:0deg; inherits:false;
}
@keyframes rotateBorder{ to{ --angle:360deg; } }

.chat-topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 24px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,0.015);
}
.chat-topbar-left{display:flex; align-items:center; gap:12px;}
.agent-avatar{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(135deg, var(--flow), #2f3fb0);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 20px -4px rgba(91,110,255,0.6);
  animation:avatarBreathe 3s ease-in-out infinite;
}
@keyframes avatarBreathe{
  0%,100%{ box-shadow:0 0 20px -4px rgba(91,110,255,0.6); transform:scale(1); }
  50%{ box-shadow:0 0 28px -2px rgba(91,110,255,0.9); transform:scale(1.05); }
}
.agent-avatar svg{width:17px; height:17px;}
.chat-topbar-title{
  font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:-0.01em;
}
.chat-topbar-sub{
  display:flex; align-items:center; gap:7px;
  font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:2px;
}
.chat-topbar-dots{display:flex; gap:6px;}
.chat-topbar-dots span{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.1);}

/* ============================= MESSAGE LOG ============================= */
.chat-log{
  height:min(52vh, 460px);
  overflow-y:auto;
  padding:26px 24px;
  display:flex; flex-direction:column; gap:18px;
  scroll-behavior:smooth;
}
.chat-log::-webkit-scrollbar{width:6px;}
.chat-log::-webkit-scrollbar-track{background:transparent;}
.chat-log::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12); border-radius:10px;}

.msg-row{display:flex; gap:10px; max-width:100%; opacity:0; transform:translateY(10px); animation:msgIn 0.5s ease forwards;}
@keyframes msgIn{ to{ opacity:1; transform:translateY(0); } }

.msg-row.agent{align-self:flex-start;}
.msg-row.user{align-self:flex-end; flex-direction:row-reverse;}

.msg-avatar{
  width:26px; height:26px; border-radius:8px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  margin-top:2px;
}
.msg-row.agent .msg-avatar{background:linear-gradient(135deg, var(--flow), #2f3fb0);}
.msg-row.user .msg-avatar{background:var(--surface-2); border:1px solid var(--line);}
.msg-avatar svg{width:13px; height:13px;}

.msg-bubble{
  max-width:420px;
  padding:13px 16px;
  border-radius:14px;
  font-size:14.5px;
  line-height:1.55;
}
.msg-bubble{ transition:transform 0.25s ease, box-shadow 0.25s ease; }
.msg-bubble:hover{ transform:translateY(-2px); }
.msg-row.agent .msg-bubble{
  background:rgba(91,110,255,0.08);
  border:1px solid rgba(91,110,255,0.25);
  border-top-left-radius:4px;
  color:#dfe3ea;
}
.msg-row.agent .msg-bubble:hover{ box-shadow:0 8px 24px -10px rgba(91,110,255,0.4); }
.msg-row.user .msg-bubble{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-top-right-radius:4px;
  color:#dfe3ea;
}
.msg-row.user .msg-bubble:hover{ box-shadow:0 8px 24px -10px rgba(0,0,0,0.5); }
.msg-time{
  font-family:var(--font-mono); font-size:10px; color:var(--muted-2);
  margin-top:6px; display:block;
}

.msg-cta{
  margin-top:12px; display:inline-flex; align-items:center; gap:8px;
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.03em;
  padding:11px 18px; background:var(--text); color:var(--bg);
  border-radius:100px; transition:transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease;
}
.msg-cta:hover{transform:translateY(-2px); box-shadow:0 12px 30px -8px rgba(91,110,255,0.5);}
.msg-cta svg{width:12px; height:12px;}

/* typing indicator */
.typing-row{display:flex; gap:10px; align-self:flex-start;}
.typing-bubble{
  background:rgba(91,110,255,0.08);
  border:1px solid rgba(91,110,255,0.25);
  border-radius:14px; border-top-left-radius:4px;
  padding:14px 16px;
  display:flex; align-items:center; gap:5px;
}
.typing-bubble span{
  width:6px; height:6px; border-radius:50%; background:var(--flow);
  animation:typingBounce 1.1s ease-in-out infinite;
}
.typing-bubble span:nth-child(2){animation-delay:0.15s;}
.typing-bubble span:nth-child(3){animation-delay:0.3s;}
@keyframes typingBounce{
  0%,60%,100%{transform:translateY(0); opacity:0.5;}
  30%{transform:translateY(-5px); opacity:1;}
}

/* quick reply chips */
.quick-replies{
  display:flex; flex-wrap:wrap; gap:8px; padding:0 24px 20px;
}
.chip{
  font-family:var(--font-mono); font-size:12px; color:var(--muted);
  padding:9px 15px; border:1px solid var(--line); border-radius:100px;
  transition:border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
}
.chip:hover{border-color:var(--flow); color:var(--text); background:var(--flow-soft);}

/* ============================= INPUT BAR ============================= */
.chat-input-bar{
  display:flex; align-items:center; gap:12px;
  padding:18px 20px;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,0.015);
}
.chat-input-wrap{
  flex:1; position:relative;
  display:flex; align-items:center;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  border-radius:14px;
  padding:4px 6px 4px 16px;
  transition:border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.chat-input-wrap:hover{
  border-color:rgba(91,110,255,0.35);
}
.chat-input-wrap.focused{
  border-color:var(--flow);
  background:rgba(91,110,255,0.05);
  box-shadow:0 0 0 4px rgba(91,110,255,0.12), 0 0 24px -6px rgba(91,110,255,0.5);
}
#chatInput{
  flex:1; background:none; border:none; outline:none;
  color:var(--text); font-family:var(--font-body); font-size:14.5px;
  padding:12px 4px;
}
#chatInput::placeholder{color:var(--muted-2);}

.send-btn{
  width:40px; height:40px; border-radius:10px; flex-shrink:0;
  background:var(--flow);
  display:flex; align-items:center; justify-content:center;
  transition:transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, background 0.25s ease;
  box-shadow:0 0 0 rgba(91,110,255,0);
  position:relative; overflow:hidden;
  animation:sendPulse 2.6s ease-in-out infinite;
}
@keyframes sendPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(91,110,255,0.35); }
  50%{ box-shadow:0 0 0 6px rgba(91,110,255,0); }
}
.send-btn .ripple{
  position:absolute; border-radius:50%; background:rgba(255,255,255,0.5);
  transform:scale(0); animation:rippleAnim 0.6s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim{ to{ transform:scale(3); opacity:0; } }
.send-btn:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 10px 24px -6px rgba(91,110,255,0.6);
}
.send-btn:active{transform:translateY(0) scale(0.97);}
.send-btn svg{width:16px; height:16px; color:#fff;}
.send-btn:disabled{opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}

.chat-footnote{
  text-align:center; margin-top:18px;
  font-family:var(--font-mono); font-size:11px; color:var(--muted-2);
  letter-spacing:0.04em;
}

/* ============================= RESPONSIVE ============================= */
@media (max-width:640px){
  main{padding:104px 16px 30px;}
  .chat-log{height:min(56vh, 440px); padding:20px 16px;}
  .msg-bubble{max-width:78vw; font-size:14px;}
  .chat-topbar{padding:15px 16px;}
  .quick-replies{padding:0 16px 16px;}
  .chat-input-bar{padding:14px 14px;}
  .header-status .agent-name{display:none;}
}
@media (max-width:420px){
  .wrap{padding:0 18px;}
}
</style>
</head>
<body>

<!-- ============================= BOOT PRELOADER ============================= -->
<div id="chatPreloader">
  <div class="boot-grid"></div>
  <div class="boot-ring"></div>
  <div class="boot-status" id="bootStatus">&nbsp;</div>
  <div class="boot-sub">PEAKFLOW SECURE CHANNEL</div>
</div>

<div class="ambient"><div class="ambient-glow"></div></div>
<div id="cursorGlow"></div>

<!-- ============================= HEADER ============================= -->
<header>
  <nav class="wrap">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 17L9 11L13 15L21 7" stroke="#5b6eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7H21V13" stroke="#5b6eff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      Peakflow<span style="color:var(--muted-2)">.io</span>
    </a>
    <div class="header-status">
      <span class="pulse-dot"></span>
      <span class="agent-name">Peakflow AI Receptionist</span>
      <span style="color:var(--muted-2)">· Online</span>
    </div>
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12L11 6M5 12L11 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to site
    </a>
  </nav>
</header>

<!-- ============================= MAIN ============================= -->
<main>
  <div class="chat-shell" id="chatShell">
    <span class="chat-eyebrow">Live trial hub</span>
    <h1 class="chat-title">Talk to your <span class="accent">AI Receptionist.</span></h1>

    <div class="chat-window">
      <div class="chat-topbar">
        <div class="chat-topbar-left">
          <div class="agent-avatar">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 17L9 11L13 15L21 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7H21V13" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <div class="chat-topbar-title">Peakflow AI Receptionist</div>
            <div class="chat-topbar-sub"><span class="pulse-dot"></span> Online · Avg reply 2s</div>
          </div>
        </div>
        <div class="chat-topbar-dots"><span></span><span></span><span></span></div>
      </div>

      <div class="chat-log" id="chatLog"></div>

      <div class="quick-replies" id="quickReplies"></div>

      <div class="chat-input-bar">
        <div class="chat-input-wrap" id="inputWrap">
          <input type="text" id="chatInput" placeholder="Type your business type…" autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="chat-footnote">ENCRYPTED SESSION · NO CREDIT CARD REQUIRED · POWERED BY PEAKFLOW</div>
  </div>
</main>

<script>
/* ============================= BOOT SEQUENCE ============================= */
(function(){
  const statusEl = document.getElementById('bootStatus');
  const preloader = document.getElementById('chatPreloader');
  const shell = document.getElementById('chatShell');
  const lines = [
    'ESTABLISHING SECURE CONNECTION...',
    'AUTHENTICATING SESSION...',
    'LOADING AI RECEPTIONIST...',
    'CHANNEL READY.'
  ];
  let li = 0, ch = 0;
  document.body.style.overflow = 'hidden';

  function typeLine(){
    if(li >= lines.length){
      setTimeout(finish, 350);
      return;
    }
    const line = lines[li];
    if(ch <= line.length){
      statusEl.innerHTML = line.slice(0, ch) + '<span class="cursor-blink">_</span>';
      ch++;
      setTimeout(typeLine, 16 + Math.random()*20);
    } else {
      li++; ch = 0;
      setTimeout(typeLine, 260);
    }
  }
  typeLine();

  function finish(){
    preloader.classList.add('hide');
    document.body.style.overflow = '';
    shell.classList.add('enter');
    setTimeout(()=>{ preloader.remove(); startBootedFlow(); }, 500);
  }
})();

/* ============================= CURSOR GLOW ============================= */
(function(){
  const glow = document.getElementById('cursorGlow');
  if(!glow) return;
  let gx=0, gy=0, tx=0, ty=0;
  window.addEventListener('mousemove', (e)=>{
    tx = e.clientX; ty = e.clientY;
    glow.style.opacity = '1';
  });
  function loop(){
    gx += (tx-gx)*0.12; gy += (ty-gy)*0.12;
    glow.style.transform = `translate(${gx}px, ${gy}px) translate(-50%,-50%)`;
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ============================= FLOATING PARTICLES ============================= */
(function(){
  const count = window.innerWidth < 700 ? 10 : 22;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random()*100 + 'vw';
    p.style.setProperty('--drift', (Math.random()*60-30)+'px');
    p.style.animationDuration = (10 + Math.random()*12) + 's';
    p.style.animationDelay = (Math.random()*14) + 's';
    document.body.appendChild(p);
  }
})();

let startBootedFlow = function(){}; // reassigned below once chat logic is defined

(function(){
  const chatLog = document.getElementById('chatLog');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const inputWrap = document.getElementById('inputWrap');
  const quickReplies = document.getElementById('quickReplies');

  const agentIcon = `<svg viewBox="0 0 24 24" fill="none"><path d="M3 17L9 11L13 15L21 7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7H21V13" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const userIcon = `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="#868c98" stroke-width="1.6"/><path d="M5 19c1.5-3.5 4.2-5 7-5s5.5 1.5 7 5" stroke="#868c98" stroke-width="1.6" stroke-linecap="round"/></svg>`;

  let stage = 0;
  let businessType = '';

  function timeNow(){
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function addMessage(text, who, opts){
    opts = opts || {};
    const row = document.createElement('div');
    row.className = 'msg-row ' + who;
    row.innerHTML = `
      <div class="msg-avatar">${who === 'agent' ? agentIcon : userIcon}</div>
      <div>
        <div class="msg-bubble">${text}${opts.cta ? `<br><a href="${opts.cta.href}" class="msg-cta">${opts.cta.label}
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>` : ''}</div>
        <span class="msg-time">${timeNow()}</span>
      </div>`;
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  function showTyping(callback, delay){
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="msg-avatar">${agentIcon}</div>
      <div class="typing-bubble"><span></span><span></span><span></span></div>`;
    chatLog.appendChild(row);
    chatLog.scrollTop = chatLog.scrollHeight;
    setTimeout(()=>{
      const el = document.getElementById('typingRow');
      if(el) el.remove();
      callback();
    }, delay || 1100);
  }

  function setQuickReplies(options){
    quickReplies.innerHTML = '';
    if(!options || !options.length) return;
    options.forEach(opt=>{
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = opt;
      chip.addEventListener('click', ()=> handleUserInput(opt));
      quickReplies.appendChild(chip);
    });
  }

  function handleUserInput(raw){
    const text = raw.trim();
    if(!text) return;
    addMessage(text, 'user');
    chatInput.value = '';
    setQuickReplies([]);
    sendBtn.disabled = true;

    showTyping(()=>{
      advanceConversation(text);
      sendBtn.disabled = false;
    }, 900 + Math.random()*700);
  }

  function advanceConversation(userText){
    if(stage === 0){
      businessType = userText;
      addMessage(`Got it — a <strong>${escapeHtml(businessType)}</strong> business. Most teams like yours lose the most time on missed calls and manual follow-ups. Where's your biggest bottleneck right now?`, 'agent');
      setQuickReplies(['Missed phone calls', 'Slow lead follow-up', 'Manual data entry', 'Appointment scheduling']);
      stage = 1;
    } else if(stage === 1){
      addMessage(`That's exactly what we fix first. We'd build you a workflow or AI receptionist specifically for <strong>${escapeHtml(userText.toLowerCase())}</strong>, wired into the tools you already use — no new software to learn.`, 'agent');
      setTimeout(()=>{
        showTyping(()=>{
          addMessage(`Ready to see it running on your business? Your 7-day free trial includes one fully built automation, live in days — not weeks.`, 'agent', {
            cta:{ href:'trial.html', label:'Start 7-day free trial' }
          });
          setQuickReplies(['What does it cost?', 'How fast can you start?']);
        }, 1200);
      }, 300);
      stage = 2;
    } else if(stage === 2){
      let reply = `Great question. During the trial, we scope one real workflow for your business at no cost — no card required. If you love it, plans start after the 7 days, tailored to how many automations you need.`;
      if(/fast|start|when|how long/i.test(userText)){
        reply = `We typically kick off within 24 hours of your trial request and have your first automation live within the 7-day window.`;
      }
      addMessage(reply, 'agent', { cta:{ href:'trial.html', label:'Start 7-day free trial' } });
      setQuickReplies(['Talk to a human instead']);
      stage = 3;
    } else {
      addMessage(`I'll flag this conversation for our team — someone from Peakflow will follow up by email shortly. In the meantime, you can lock in your trial below.`, 'agent', {
        cta:{ href:'trial.html', label:'Start 7-day free trial' }
      });
      setQuickReplies([]);
    }
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  sendBtn.addEventListener('click', (e)=>{ fireRipple(e); handleUserInput(chatInput.value); });
  chatInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') handleUserInput(chatInput.value);
  });
  chatInput.addEventListener('focus', ()=> inputWrap.classList.add('focused'));
  chatInput.addEventListener('blur', ()=> inputWrap.classList.remove('focused'));

  function fireRipple(e){
    const r = sendBtn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(r.width, r.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = ((e.clientX || r.left + r.width/2) - r.left - size/2) + 'px';
    ripple.style.top = ((e.clientY || r.top + r.height/2) - r.top - size/2) + 'px';
    sendBtn.appendChild(ripple);
    setTimeout(()=> ripple.remove(), 650);
  }

  /* ============================= INITIAL GREETING (fires after boot sequence) ============================= */
  startBootedFlow = function(){
    showTyping(()=>{
      addMessage(`Welcome to Peakflow.io. I am your automated agent. Let's build your 7-Day Free Trial framework. What is your business type?`, 'agent');
      setQuickReplies(['HVAC / Field service', 'Real estate', 'Legal practice', 'Medical clinic']);
    }, 700);
  };
})();
</script>
