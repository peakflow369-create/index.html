<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peakflow.io — Automation Infrastructure for Modern Business</title>
<meta name="description" content="Peakflow builds n8n automations and AI receptionists that run your business while you sleep.">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>

<style>
/* ============================= TOKENS ============================= */
:root{
  --bg: #08090c;
  --surface: #0f1116;
  --surface-2: #14161d;
  --line: rgba(255,255,255,0.08);
  --text: #eef0f3;
  --muted: #868c98;
  --muted-2: #5a5f6a;
  --flow: #5b6eff;
  --flow-soft: rgba(91,110,255,0.14);
  --ember: #ff7a45;
  --lime: #c6ff3d;
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg);}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overflow-x:hidden;
  cursor:default;
  line-height:1.5;
}
::selection{background:var(--flow);color:#fff;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
}

a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

:focus-visible{outline:2px solid var(--flow); outline-offset:3px;}

.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--flow);
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.eyebrow::before{
  content:'';
  width:6px;height:6px;
  background:var(--flow);
  border-radius:50%;
  box-shadow:0 0 8px 2px var(--flow-soft);
}

.wrap{max-width:1180px; margin:0 auto; padding:0 32px;}

/* ============================= PRELOADER ============================= */
#preloader{
  position:fixed; inset:0; z-index:9999;
  background:#08090c;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:var(--font-mono);
  transition:opacity 0.8s ease, visibility 0.8s ease;
}
#preloader.hide{opacity:0; visibility:hidden; pointer-events:none;}
.pre-grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(91,110,255,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,110,255,0.06) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(circle at center, black 0%, transparent 75%);
  animation:gridPulse 3s ease-in-out infinite;
}
@keyframes gridPulse{
  0%,100%{opacity:0.5;}
  50%{opacity:1;}
}
.pre-content{position:relative; z-index:2; text-align:center;}
.pre-mark{
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:0.4em;
  color:var(--muted);
  margin-bottom:28px;
  text-transform:uppercase;
  opacity:0;
}
.pre-status{
  font-size:11px;
  color:var(--flow);
  letter-spacing:0.1em;
  height:16px;
  margin-bottom:22px;
  min-width:280px;
}
.pre-status .cursor-blink{animation:blink 0.9s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.pre-bar-track{
  width:280px; height:1px;
  background:rgba(255,255,255,0.1);
  position:relative;
  overflow:hidden;
}
.pre-bar-fill{
  position:absolute; left:0; top:0; height:100%;
  width:0%;
  background:linear-gradient(90deg, var(--flow), var(--lime));
  box-shadow:0 0 12px var(--flow);
}
.pre-pct{
  font-size:11px; color:var(--muted-2); margin-top:14px; letter-spacing:0.1em;
}
.pre-scanline{
  position:absolute; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, rgba(91,110,255,0.6), transparent);
  animation:scan 2.4s linear infinite;
}
@keyframes scan{
  0%{top:-2%;}
  100%{top:102%;}
}
.pre-corner{
  position:absolute; width:22px; height:22px;
  border-color:var(--flow); opacity:0.6;
}
.pre-corner.tl{top:40px; left:40px; border-top:1px solid; border-left:1px solid;}
.pre-corner.tr{top:40px; right:40px; border-top:1px solid; border-right:1px solid;}
.pre-corner.bl{bottom:40px; left:40px; border-bottom:1px solid; border-left:1px solid;}
.pre-corner.br{bottom:40px; right:40px; border-bottom:1px solid; border-right:1px solid;}

/* ============================= OPENING / INTRO SEQUENCE ============================= */
#introSequence{
  position:fixed; inset:0; z-index:9998;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg);
  opacity:0; pointer-events:none;
}
#introSequence.play{opacity:1; pointer-events:all;}
.intro-mark{
  position:relative; width:64px; height:64px;
  display:flex; align-items:center; justify-content:center;
  transform:scale(0.4); opacity:0;
}
.intro-mark svg{width:34px; height:34px; position:relative; z-index:2;}
.intro-ring{
  position:absolute; border:1px solid var(--flow); border-radius:50%;
  opacity:0;
}
.intro-ring.r1{width:64px; height:64px;}
.intro-ring.r2{width:64px; height:64px;}
.intro-ring.r3{width:64px; height:64px;}
.intro-beam{
  position:absolute; top:50%; left:50%;
  height:1px; width:0;
  background:linear-gradient(90deg, var(--flow), transparent);
  transform-origin:left center;
  opacity:0;
}
.intro-flash{
  position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%, rgba(91,110,255,0.35), transparent 60%);
  opacity:0;
}
.intro-grid-lines{
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(91,110,255,0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(91,110,255,0.5) 1px, transparent 1px);
  background-size:64px 64px;
  opacity:0;
  mask-image:radial-gradient(circle at 50% 50%, black 0%, transparent 45%);
}

/* ============================= CURSOR GLOW ============================= */
#cursorGlow{
  position:fixed; top:0; left:0; z-index:60;
  width:420px; height:420px; border-radius:50%;
  background:radial-gradient(circle, rgba(91,110,255,0.10), transparent 70%);
  transform:translate(-50%,-50%);
  pointer-events:none;
  will-change:transform;
  opacity:0;
  transition:opacity 0.4s ease;
}
@media (max-width:860px){ #cursorGlow{display:none;} }

/* ============================= MAGNETIC BUTTON ============================= */
.magnetic{will-change:transform;}

/* ============================= CARD TILT ============================= */
.tilt-card{ transform-style:preserve-3d; will-change:transform; transition:transform 0.15s ease-out; }

/* ============================= EXTRA MICRO ANIMATIONS ============================= */
.nav-links a:not(.nav-cta){position:relative;}
.nav-links a:not(.nav-cta)::after{
  content:''; position:absolute; left:0; bottom:-4px; width:0; height:1px;
  background:var(--flow); transition:width 0.3s ease;
}
.nav-links a:not(.nav-cta):hover::after{width:100%;}

.logo-mark svg path{
  stroke-dasharray:40; stroke-dashoffset:40;
  animation:drawLogo 1.4s ease forwards 0.3s;
}
@keyframes drawLogo{ to{ stroke-dashoffset:0; } }

.wf-node{ animation:nodeFloat 5s ease-in-out infinite; }
.wf-node.n1{ animation-delay:0s; }
.wf-node.n2{ animation-delay:0.6s; }
.wf-node.n3{ animation-delay:1.2s; }
.wf-node.n4{ animation-delay:1.8s; }
.wf-node.n5{ animation-delay:2.4s; }
@keyframes nodeFloat{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-5px); }
}

.process-step{ position:relative; overflow:hidden; }
.process-step::before{
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(91,110,255,0.12), transparent 60%);
  opacity:0; transition:opacity 0.3s ease; pointer-events:none;
}
.process-step:hover::before{opacity:1;}
.process-step:hover .idx{color:var(--lime);}
.process-step .idx{transition:color 0.3s ease;}

.feature-visual{transition:box-shadow 0.4s ease, border-color 0.4s ease;}
.feature-visual:hover{box-shadow:0 20px 60px -20px rgba(91,110,255,0.35); border-color:rgba(91,110,255,0.3);}

.trust-row span{transition:color 0.3s ease, opacity 0.3s ease;}
.trust-row span:hover{color:var(--flow); opacity:1;}

.hero-stat{transition:transform 0.3s ease;}
.hero-stat:hover{transform:translateY(-3px);}

@keyframes ctaGlowPulse{
  0%,100%{ opacity:0.6; transform:translate(-50%,-50%) scale(1); }
  50%{ opacity:1; transform:translate(-50%,-50%) scale(1.15); }
}
.cta-glow{ animation:ctaGlowPulse 5s ease-in-out infinite; }

.scroll-cue{ animation:cueFade 2.4s ease-in-out infinite; }
@keyframes cueFade{
  0%,100%{opacity:0.5;}
  50%{opacity:1;}
}

/* ============================= NAV ============================= */
header{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding:22px 0;
  background:rgba(8,9,12,0);
  border-bottom:1px solid transparent;
  transition:background 0.4s ease, border-color 0.4s ease, padding 0.4s ease;
}
header.scrolled{
  background:rgba(8,9,12,0.75);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:16px 0;
}
nav{display:flex; align-items:center; justify-content:space-between;}
.logo{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  letter-spacing:-0.01em;
  display:flex; align-items:center; gap:10px;
}
.logo-mark{
  width:20px;height:20px;position:relative;
}
.logo-mark svg{width:100%;height:100%;}
.nav-links{display:flex; gap:36px; align-items:center;}
.nav-links a{
  font-size:14px; color:var(--muted); transition:color 0.25s ease;
  position:relative;
}
.nav-links a:not(.nav-cta):hover{color:var(--text);}
.nav-cta{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:0.05em;
  padding:9px 18px;
  border:1px solid var(--line);
  border-radius:100px;
  color:var(--text) !important;
  transition:border-color 0.25s ease, background 0.25s ease;
}
.nav-cta:hover{border-color:var(--flow); background:var(--flow-soft);}
.nav-toggle{display:none;}

/* ============================= HERO ============================= */
#hero-canvas{
  position:absolute; inset:0; z-index:0;
  opacity:0;
}
.hero{
  position:relative;
  min-height:100vh;
  display:flex; align-items:center;
  padding-top:120px;
  overflow:hidden;
}
.hero-vignette{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 30%, transparent 0%, rgba(8,9,12,0.55) 65%, var(--bg) 100%);
}
.hero-inner{
  position:relative; z-index:2;
  width:100%;
  text-align:center;
}
.hero-inner .eyebrow{margin-bottom:26px;}
.hero h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(40px, 7vw, 84px);
  line-height:1.02;
  letter-spacing:-0.03em;
  max-width:920px;
  margin:0 auto 26px;
}
.hero h1 .accent{
  background:linear-gradient(100deg, var(--flow) 10%, #9fb0ff 50%, var(--flow) 90%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.hero p.lead{
  font-size:clamp(16px, 1.6vw, 19px);
  color:var(--muted);
  max-width:560px;
  margin:0 auto 42px;
}
.hero-actions{
  display:flex; align-items:center; justify-content:center; gap:18px;
  flex-wrap:wrap;
  margin-bottom:74px;
}
.btn-primary{
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:0.04em;
  padding:15px 30px;
  background:var(--text);
  color:var(--bg);
  border-radius:100px;
  display:inline-flex; align-items:center; gap:10px;
  transition:transform 0.3s cubic-bezier(.2,.8,.2,1), box-shadow 0.3s ease;
  box-shadow:0 0 0 rgba(91,110,255,0);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px -8px rgba(91,110,255,0.5);
}
.btn-primary svg{width:14px;height:14px; transition:transform 0.3s ease;}
.btn-primary:hover svg{transform:translateX(3px);}
.btn-ghost{
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--muted);
  padding:15px 22px;
  transition:color 0.25s ease;
  display:inline-flex; align-items:center; gap:8px;
}
.btn-ghost:hover{color:var(--text);}

.hero-stats{
  position:relative; z-index:2;
  display:flex; justify-content:center; gap:0;
  border-top:1px solid var(--line);
  max-width:760px; margin:0 auto;
  padding-top:0;
}
.hero-stat{
  flex:1; padding:22px 20px; text-align:center;
  border-right:1px solid var(--line);
}
.hero-stat:last-child{border-right:none;}
.hero-stat .num{
  font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--text);
}
.hero-stat .label{
  font-family:var(--font-mono); font-size:11px; color:var(--muted-2);
  letter-spacing:0.05em; margin-top:4px;
}

.scroll-cue{
  position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
  z-index:2;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  color:var(--muted-2);
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.15em;
}
.scroll-line{
  width:1px; height:36px;
  background:linear-gradient(var(--flow), transparent);
  animation:scrollDown 2s ease-in-out infinite;
}
@keyframes scrollDown{
  0%{transform:scaleY(0); transform-origin:top;}
  50%{transform:scaleY(1); transform-origin:top;}
  51%{transform-origin:bottom;}
  100%{transform:scaleY(0); transform-origin:bottom;}
}

/* ============================= SECTION SHARED ============================= */
section{position:relative;}
.section-pad{padding:150px 0;}
.section-head{
  max-width:640px; margin:0 auto 80px; text-align:center;
}
.section-head h2{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(30px, 4vw, 46px);
  letter-spacing:-0.02em;
  margin-top:20px;
  line-height:1.1;
}
.section-head p{
  color:var(--muted); margin-top:18px; font-size:16px;
}
.divider{
  height:1px; background:var(--line); width:100%;
}

/* ============================= FEATURES ============================= */
.feature-block{
  display:grid; grid-template-columns:1fr 1fr;
  gap:80px; align-items:center;
  padding:90px 0;
}
.feature-block.reverse .feature-visual{order:2;}
.feature-block.reverse .feature-copy{order:1;}
.feature-copy .eyebrow{margin-bottom:20px;}
.feature-copy h3{
  font-family:var(--font-display);
  font-size:clamp(26px,3vw,36px);
  font-weight:600;
  letter-spacing:-0.02em;
  margin-bottom:18px;
  line-height:1.15;
}
.feature-copy p{
  color:var(--muted); font-size:16px; margin-bottom:28px; max-width:440px;
}
.feature-list{list-style:none; display:flex; flex-direction:column; gap:14px;}
.feature-list li{
  display:flex; align-items:flex-start; gap:12px;
  font-size:14.5px; color:#c3c7cf;
}
.feature-list li svg{flex-shrink:0; margin-top:3px; width:14px; height:14px; color:var(--flow);}

.feature-visual{
  position:relative;
  aspect-ratio:4/3.1;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.visual-topbar{
  height:38px; display:flex; align-items:center; gap:7px;
  padding:0 16px; border-bottom:1px solid var(--line);
  background:rgba(255,255,255,0.02);
}
.visual-topbar span{width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.12);}
.visual-topbar .path{
  margin-left:12px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted-2);
}

/* ---- workflow canvas graphic ---- */
.wf-canvas{
  position:relative; width:100%; height:calc(100% - 38px);
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size:22px 22px;
}
.wf-canvas svg{position:absolute; inset:0; width:100%; height:100%;}
.wf-edge{
  fill:none; stroke:rgba(91,110,255,0.35); stroke-width:1.5;
}
.wf-edge-flow{
  fill:none; stroke:var(--flow); stroke-width:1.5;
  stroke-dasharray:6 8;
  animation:dashMove 1.6s linear infinite;
}
@keyframes dashMove{to{stroke-dashoffset:-140;}}
.wf-node{
  position:absolute;
  width:118px;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 11px;
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--muted);
  box-shadow:0 8px 24px -8px rgba(0,0,0,0.5);
}
.wf-node .dot{
  width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;
}
.wf-node.active{border-color:rgba(91,110,255,0.5); box-shadow:0 0 0 1px rgba(91,110,255,0.2), 0 8px 24px -8px rgba(0,0,0,0.5);}
.wf-node .title{color:var(--text); font-size:11px; margin-top:2px;}
.wf-node.n1{top:14%; left:5%;}
.wf-node.n2{top:8%; left:38%;}
.wf-node.n3{top:44%; left:38%;}
.wf-node.n4{top:26%; left:70%;}
.wf-node.n5{top:64%; left:70%;}

/* ---- AI receptionist visual ---- */
.ai-visual-inner{
  padding:26px; height:calc(100% - 38px);
  display:flex; flex-direction:column; justify-content:center; gap:16px;
}
.call-bubble{
  background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; max-width:82%;
  font-size:13px; color:#c3c7cf;
}
.call-bubble .who{
  font-family:var(--font-mono); font-size:10px; color:var(--muted-2); margin-bottom:6px; letter-spacing:0.05em;
}
.call-bubble.ai{align-self:flex-end; border-color:rgba(91,110,255,0.35); background:rgba(91,110,255,0.06);}
.wave-row{display:flex; align-items:center; gap:2px; height:20px; margin-top:6px;}
.wave-row .bar{
  width:2px; background:var(--flow); border-radius:2px;
  animation:waveAnim 1.2s ease-in-out infinite;
}
@keyframes waveAnim{
  0%,100%{height:4px;}
  50%{height:18px;}
}

/* ============================= LOGOS / TRUST ============================= */
.trust-row{
  display:flex; justify-content:center; align-items:center;
  gap:56px; flex-wrap:wrap;
  padding:50px 0;
  opacity:0.55;
}
.trust-row span{
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.1em; color:var(--muted-2);
}

/* ============================= PROCESS ============================= */
.process-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}
.process-step{
  background:var(--surface); padding:34px 26px;
}
.process-step .idx{
  font-family:var(--font-mono); font-size:11px; color:var(--flow); margin-bottom:22px; display:block;
}
.process-step h4{
  font-family:var(--font-display); font-size:18px; font-weight:600; margin-bottom:10px;
}
.process-step p{color:var(--muted); font-size:14px;}

/* ============================= CTA ============================= */
.cta-section{
  padding:150px 0;
  position:relative;
  text-align:center;
  overflow:hidden;
}
.cta-glow{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:600px; height:600px;
  background:radial-gradient(circle, rgba(91,110,255,0.16), transparent 70%);
  pointer-events:none;
}
.cta-section .eyebrow{margin-bottom:24px;}
.cta-section h2{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(32px,5vw,58px); letter-spacing:-0.02em;
  max-width:680px; margin:0 auto 22px; position:relative; z-index:2;
}
.cta-section p{color:var(--muted); font-size:17px; margin-bottom:44px; position:relative; z-index:2;}
.cta-note{
  font-family:var(--font-mono); font-size:11.5px; color:var(--muted-2); margin-top:22px;
  position:relative; z-index:2;
}

/* ============================= FOOTER ============================= */
footer{
  border-top:1px solid var(--line);
  padding:56px 0 40px;
}
